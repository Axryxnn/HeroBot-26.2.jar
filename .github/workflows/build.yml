name: Build HeroBot Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip agon-agent_2-e8baa706.zip -d extracted_project

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Minecraft mod
        run: |
          cd extracted_project
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeroBot-Mod
          path: extracted_project/build/libs/*.jar
          if-no-files-found: error
